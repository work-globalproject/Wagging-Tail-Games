<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="tailShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#184D7A" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background rounded canvas (for app icons) -->
  <rect width="512" height="512" rx="120" fill="#F8FCFD" />

  <!-- Motion wag swooshes -->
  <g>
    <path d="M 130 145 C 160 100, 220 70, 275 80" fill="none" stroke="#40B3C9" stroke-width="14" stroke-linecap="round" opacity="0.9" />
    <path d="M 170 190 C 200 155, 250 135, 295 145" fill="none" stroke="#184D7A" stroke-width="10" stroke-linecap="round" opacity="0.75" />
    <path d="M 405 110 C 455 145, 470 200, 460 255" fill="none" stroke="#40B3C9" stroke-width="14" stroke-linecap="round" opacity="0.9" />
    <path d="M 438 165 C 475 200, 480 250, 465 295" fill="none" stroke="#184D7A" stroke-width="10" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- High-visibility Large Animated Dog Tail -->
  <g filter="url(#tailShadow)">
    <!-- Base Saffron Orange Fluffy Tail Silhouette -->
    <path d="M 105 440 
             C 125 380, 215 320, 295 265
             C 335 235, 365 175, 378 120
             C 390 185, 378 235, 415 248
             C 396 295, 415 330, 430 355
             C 402 380, 390 410, 402 445
             C 370 440, 338 458, 330 482
             C 298 455, 250 445, 230 470
             C 195 440, 160 440, 142 452
             C 118 446, 108 443, 105 440 Z"
          fill="#FF7C00"
          stroke="#184D7A"
          stroke-width="22"
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- Papaya Orange Inner Fur Highlights -->
    <path d="M 135 418 
             C 190 365, 265 300, 325 258
             C 355 232, 372 178, 378 122
             C 384 168, 375 212, 400 224
             C 365 255, 330 308, 292 350
             C 230 405, 180 425, 135 418 Z"
          fill="#FFB82E" />

    <!-- White Fur Highlights -->
    <path d="M 305 275 C 325 300, 350 320, 370 326" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
