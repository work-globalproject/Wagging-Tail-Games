name: Validate V1
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run check
      - run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - run: npx firebase emulators:exec --config firebase.emulators.json --project demo-wagging-tail --only firestore,auth "npm run test:e2e"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Select Xcode 26 or newer
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort | tail -1)
          test -n "$XCODE_APP" || { echo 'Xcode 26 is required on this runner'; exit 1; }
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - run: npm ci
      - run: npm run build:native
      - run: npx cap sync ios
      - name: Build for iOS Simulator without signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
